spring:
  application:
    name: kitchen-garden
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/kitchengarden}
    driver-class-name: org.postgresql.Driver
    username: ${DATASOURCE_USERNAME:kitchengarden}
    password: ${DATASOURCE_PASSWORD:kitchengarden}
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@kitchengarden.local}