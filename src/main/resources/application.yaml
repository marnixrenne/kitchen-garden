server:
  port: ${PORT:8080}

spring:
  application:
    name: kitchen-garden
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kitchengarden}}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:kitchengarden}
    password: ${DB_PASSWORD:kitchengarden}
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  admin:
    password: ${ADMIN_PASSWORD:admin}
  mail:
    from: ${MAIL_FROM:noreply@kitchengarden.local}
    resend:
      api-key: ${RESEND_API_KEY:}